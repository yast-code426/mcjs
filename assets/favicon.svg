<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 草地块纹理 - 顶部 -->
    <linearGradient id="grassTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB342"/>
      <stop offset="50%" style="stop-color:#8BC34A"/>
      <stop offset="100%" style="stop-color:#689F38"/>
    </linearGradient>
    
    <!-- 草地块侧面 -->
    <linearGradient id="grassSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC34A"/>
      <stop offset="15%" style="stop-color:#7CB342"/>
      <stop offset="30%" style="stop-color:#8D6E63"/>
      <stop offset="100%" style="stop-color:#6D4C41"/>
    </linearGradient>
    
    <!-- 草地块底部 -->
    <linearGradient id="grassBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6D4C41"/>
      <stop offset="100%" style="stop-color:#5D4037"/>
    </linearGradient>
    
    <!-- 背景渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </radialGradient>
    
    <!-- 按钮发光 -->
    <radialGradient id="btnGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#4FC3F7;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="400" rx="30" ry="30" fill="url(#bgGrad)"/>
  
  <!-- 装饰性背景网格 -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
  </g>
  
  <!-- ===== 主草地块（等距方块） ===== -->
  <g transform="translate(200, 195)">
    
    <!-- 底部阴影 -->
    <ellipse cx="0" cy="75" rx="85" ry="25" fill="#000000" opacity="0.3"/>
    
    <!-- 底部面 -->
    <polygon points="-60,45 0,75 60,45 0,15" fill="url(#grassBottom)" stroke="#5D4037" stroke-width="2"/>
    
    <!-- 左侧面 -->
    <polygon points="-60,45 -60,-15 0,-45 0,15" fill="url(#grassSide)" stroke="#5D4037" stroke-width="2"/>
    <polygon points="-60,45 -60,-15 0,-45 0,15" fill="#7CB342" opacity="0.15"/>
    
    <!-- 右侧面 -->
    <polygon points="0,15 0,-45 60,-15 60,45" fill="url(#grassSide)" stroke="#5D4037" stroke-width="2"/>
    <polygon points="0,15 0,-45 60,-15 60,45" fill="#5D4037" opacity="0.15"/>
    
    <!-- 顶部面（草块顶部） -->
    <polygon points="-60,-15 -30,-45 0,-15 -30,15" fill="url(#grassTop)" stroke="#558B2F" stroke-width="2"/>
    <polygon points="0,-15 30,-45 60,-15 30,15" fill="url(#grassTop)" stroke="#558B2F" stroke-width="2"/>
    
    <!-- 顶部网格线（草块纹理细节） -->
    <g stroke="#7CB342" stroke-width="0.8" opacity="0.5">
      <!-- 左侧顶部网格 -->
      <line x1="-45" y1="-15" x2="-15" y2="-30"/>
      <line x1="-45" y1="-15" x2="-30" y2="0"/>
      <line x1="-30" y1="-30" x2="-15" y2="-15"/>
      <!-- 右侧顶部网格 -->
      <line x1="15" y1="-30" x2="45" y2="-15"/>
      <line x1="15" y1="-30" x2="30" y2="0"/>
      <line x1="30" y1="0" x2="60" y2="-15"/>
    </g>
    
    <!-- 高光 -->
    <polygon points="-60,-15 -30,-45 0,-15 -30,15" fill="#ffffff" opacity="0.08"/>
  </g>
  
  <!-- ===== 游戏标题 ===== -->
  <text x="200" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" letter-spacing="3">
    方块启动器
  </text>
  <text x="200" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888899" letter-spacing="5">
    BLOCK LAUNCHER
  </text>
  
  <!-- ===== 播放按钮 ===== -->
  <g transform="translate(200, 130)">
    <!-- 按钮外发光 -->
    <circle cx="0" cy="0" r="38" fill="url(#btnGlow)"/>
    
    <!-- 按钮背景 -->
    <circle cx="0" cy="0" r="30" fill="#2a2a4a" stroke="#4FC3F7" stroke-width="2.5"/>
    
    <!-- 播放三角形 -->
    <polygon points="-10,-14 -10,14 16,0" fill="#4FC3F7"/>
    
    <!-- 按钮光晕 -->
    <circle cx="0" cy="0" r="30" fill="#4FC3F7" opacity="0.08"/>
  </g>
  
  <!-- ===== 装饰小星星 ===== -->
  <g fill="#4FC3F7" opacity="0.3">
    <rect x="45" y="55" width="3" height="3" rx="1"/>
    <rect x="340" y="75" width="2" height="2" rx="1"/>
    <rect x="60" y="280" width="2" height="2" rx="1"/>
    <rect x="330" y="260" width="3" height="3" rx="1"/>
    <rect x="80" y="120" width="2" height="2" rx="1"/>
    <rect x="310" y="140" width="2" height="2" rx="1"/>
  </g>
  
  <!-- ===== 底部装饰条 ===== -->
  <rect x="80" y="365" width="240" height="2" rx="1" fill="#4FC3F7" opacity="0.2"/>
  <rect x="140" y="372" width="120" height="1" rx="0.5" fill="#4FC3F7" opacity="0.1"/>
  
</svg>